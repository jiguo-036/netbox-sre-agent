<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetBox 运维助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f6f8;height:100vh;display:flex;flex-direction:column;color:#1f2937}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
header h1{font-size:16px;font-weight:600}
header .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;
  display:inline-block;margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.4}}
#log{flex:1;overflow-y:auto;padding:20px;max-width:900px;width:100%;margin:0 auto}

.msg{margin-bottom:16px;display:flex;gap:10px}
.msg .av{width:32px;height:32px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600}
.msg.user .av{background:#3b82f6}
.msg.bot .av{background:#f97316}
.msg .wrap{flex:1;min-width:0}
.msg .bd{background:#fff;border:1px solid #e5e7eb;border-radius:10px;
  padding:14px 18px;word-break:break-word}
.msg.user .bd{background:#eff6ff;border-color:#bfdbfe}
.msg .meta{font-size:11px;color:#9ca3af;margin-top:6px}

/* Markdown 元素 */
.bd h2{font-size:16px;margin:14px 0 8px;padding-left:10px;border-left:3px solid #f97316}
.bd h3{font-size:15px;margin:12px 0 6px}
.bd p{margin:6px 0}
.bd ul,.bd ol{margin:6px 0;padding-left:22px}
.bd li{margin:3px 0}
.bd code{background:#f3f4f6;padding:2px 6px;border-radius:4px;
  font-family:"SF Mono",Consolas,monospace;font-size:12.5px;color:#dc2626}
.bd pre{background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;
  overflow-x:auto;margin:10px 0}
.bd pre code{background:none;color:inherit;padding:0}
.bd table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.bd th,.bd td{border:1px solid #e5e7eb;padding:7px 10px;text-align:left}
.bd th{background:#f9fafb;font-weight:600}
.bd tr:nth-child(even) td{background:#fafafa}
.bd blockquote{border-left:3px solid #d1d5db;padding-left:12px;color:#6b7280;margin:8px 0}
.bd strong{color:#111827}

/* 工具调用步骤卡片 */
.steps{margin:0 0 12px;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:#fff}
.steps summary{padding:10px 14px;background:#f9fafb;font-size:12.5px;color:#6b7280;
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.steps summary::-webkit-details-marker{display:none}
.steps summary::before{content:"▸";transition:.2s}
.steps[open] summary::before{transform:rotate(90deg)}
.step{border-top:1px solid #f0f0f0;padding:10px 14px;font-size:12.5px}
.step .name{font-weight:600;color:#f97316;font-family:Consolas,monospace}
.step .args{color:#6b7280;font-family:Consolas,monospace;font-size:12px;margin:2px 0}
.step .out{background:#f8fafc;border-radius:6px;padding:8px;margin-top:6px;
  font-family:Consolas,monospace;font-size:11.5px;color:#475569;
  max-height:120px;overflow-y:auto;white-space:pre-wrap}

footer{background:#fff;border-top:1px solid #e5e7eb;padding:12px 20px;flex-shrink:0}
.inp{max-width:900px;margin:0 auto;display:flex;gap:8px}
.inp input{flex:1;border:1px solid #d1d5db;border-radius:8px;padding:10px 14px;font-size:14px}
.inp input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.inp button{background:#3b82f6;color:#fff;border:none;border-radius:8px;
  padding:0 22px;font-size:14px;cursor:pointer;font-weight:500}
.inp button:disabled{background:#9ca3af;cursor:not-allowed}
.quick{max-width:900px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.quick span{font-size:12px;color:#6b7280;background:#e5e7eb;
  padding:4px 12px;border-radius:14px;cursor:pointer;transition:.15s}
.quick span:hover{background:#d1d5db;color:#374151}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>NetBox 运维助手</h1>
  <span style="font-size:12px;color:#6b7280" id="sid">未开始</span>
</header>

<div id="log">
  <div class="msg bot"><div class="av">AI</div><div class="wrap">
    <div class="bd">你好，我可以帮你排查 NetBox 的容器状态、日志和 API 问题。
直接描述症状即可，例如"页面打不开"或"netbox 服务好像有问题"。
<br><br>排查过程会折叠在上方，点击可展开查看每一步的工具调用。</div>
    <div class="meta"></div></div>
  </div>
</div>

<footer>
  <div class="inp">
    <input id="q" placeholder="描述你遇到的问题…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <div class="quick">
    <span>netbox 服务好像有问题，帮我看看</span>
    <span>最近 200 行日志有没有报错</span>
    <span>postgres 和 redis 状态正常吗</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let sid = null;
const log = document.getElementById('log');
const q = document.getElementById('q');
const btn = document.getElementById('send');

// Markdown 渲染：marked 未加载成功时降级为纯文本
function renderMD(text) {
  if (window.marked) {
    try { return marked.parse(text); } catch (e) { return escape(text); }
  }
  return escape(text).replace(/\n/g, '<br>');
}
function escape(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// 解析后端返回的 [step N] 过程日志，抽成折叠卡片
function parseSteps(text) {
  const lines = text.split('\n');
  const steps = [];
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^\[step\s+(\d+)\]\s+(\S+)\s*(.*)$/);
    if (m) {
      const out = (lines[i + 1] && lines[i + 1].startsWith('{')) ? lines[i + 1] : '';
      steps.push({ n: m[1], name: m[2], args: m[3], out });
      if (out) i++;
    }
  }
  // 去掉过程行，只留结论
  const clean = lines.filter(l => !/^\[step\s+\d+\]/.test(l) && !/^\{/.test(l)).join('\n').trim();
  return { steps, clean };
}

function renderBot(bd, text) {
  const { steps, clean } = parseSteps(text);
  bd.innerHTML = '';
  if (steps.length) {
    const det = document.createElement('details');
    det.className = 'steps';
    det.innerHTML = `<summary>排查过程 · 调用了 ${steps.length} 个工具</summary>` +
      steps.map(s => `<div class="step">
        <div><span class="name">${escape(s.name)}</span> ${escape(s.args)}</div>
        ${s.out ? `<div class="out">${escape(s.out.slice(0, 2000))}</div>` : ''}
      </div>`).join('');
    bd.appendChild(det);
  }
  bd.insertAdjacentHTML('beforeend', renderMD(clean));
}

function add(role, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div class="av">${role === 'user' ? '我' : 'AI'}</div>
    <div class="wrap"><div class="bd"></div><div class="meta"></div></div>`;
  const bd = d.querySelector('.bd');
  if (role === 'bot') {
    renderBot(bd, text);
  } else {
    bd.textContent = text;
  }
  if (meta) d.querySelector('.meta').textContent = meta;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function setMeta(node, text) {
  const el = node && node.querySelector('.meta');
  if (el) el.textContent = text;
}

async function send() {
  const text = q.value.trim();
  if (!text || btn.disabled) return;
  q.value = '';
  add('user', text);
  btn.disabled = true;
  const loading = add('bot', '正在排查…');
  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, session_id: sid })
    });
    const j = await r.json();
    const bd = loading.querySelector('.bd');
    if (bd) renderBot(bd, j.reply || '（无回复）');
    setMeta(loading, `耗时 ${j.elapsed}s`);
    if (j.session_id) {
      sid = j.session_id;
      const s = document.getElementById('sid');
      if (s) s.textContent = '会话 ' + sid.slice(0, 8);
    }
  } catch (e) {
    const bd = loading.querySelector('.bd');
    if (bd) bd.textContent = '请求失败：' + e.message;
  } finally {
    btn.disabled = false;
    q.focus();
  }
}

btn.onclick = send;
q.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
document.querySelectorAll('.quick span').forEach(s => {
  s.onclick = () => { q.value = s.textContent; send(); };
});
</script>
</body>
</html>
